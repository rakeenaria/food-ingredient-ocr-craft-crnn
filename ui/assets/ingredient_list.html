<div class="il">
  <label class="search">
    <span class="search-label">Find an ingredient</span>
    <input
      type="search"
      placeholder="Type a word, for example milk"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
      enterkeyhint="search"
    />
  </label>
  <p class="status" aria-live="polite"></p>
  <ol class="items"></ol>
  <div class="notes" hidden>
    <p class="notes-title">Also on the label</p>
    <ul class="note-list"></ul>
  </div>
</div>
